name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Signed-off-by on every commit
        # Event values go through env, never straight into the script, so a
        # crafted value cannot inject shell.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base="$BASE_SHA"
          head="$HEAD_SHA"
          missing=0
          while read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base".."$head")

          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Every commit needs a Developer Certificate of Origin sign-off."
            echo "Fix the most recent commit with:  git commit --amend --signoff"
            echo "Fix a whole branch with:          git rebase --signoff origin/main"
            exit 1
          fi
          echo "All commits are signed off."
