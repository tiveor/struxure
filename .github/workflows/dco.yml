name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done < <(git rev-list --no-merges "$base".."$head")

          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Every commit needs a Developer Certificate of Origin sign-off."
            echo "Fix the most recent commit with:  git commit --amend --signoff"
            echo "Fix a whole branch with:          git rebase --signoff origin/main"
            exit 1
          fi
          echo "All commits are signed off."
