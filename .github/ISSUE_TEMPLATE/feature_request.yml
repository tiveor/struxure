name: Feature request
description: Suggest a capability for Struxure
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation you are stuck in, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: checkboxes
    id: roadmap
    attributes:
      label: Checks
      options:
        - label: I checked ROADMAP.md and this is not already planned
          required: true
