name: Bug report
description: Something in the app does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the Portal Frame template
        2. Click Analyze
        3. Open the Results tab
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS 15
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Struxure version
      description: Shown in the About dialog.
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Any errors from the developer tools console.
      render: text
